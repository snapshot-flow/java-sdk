name: Build

# Runs the test suite on every push to main and on every pull request, so
# breakage is caught before a release tag is pushed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: JDK ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The bytecode targets Java 8 (maven.compiler.release=8), which needs a JDK 9+ compiler.
        os: [ubuntu-latest]
        java: ['11', '17', '21']
        include:
          - os: windows-latest
            java: '17'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify
